name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LLM_MOCK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # build before tsc: next build generates the route types tsc depends on
      - run: npx next build
      - run: npx tsc --noEmit
      - run: npm test
